<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>anyGem Agent - Intelligence Redefined</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --sidebar-bg: #FAFAFA;
            --chat-bg: #FFFFFF;
            --text-primary: #1A1A1A;
            --text-secondary: #5D5D5D;
            --accent-blue: #007AFF;
            --border-light: rgba(26, 26, 26, 0.1);
        }

        body { 
            background-color: var(--chat-bg); 
            color: var(--text-primary); 
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* 側邊欄窄化設計 */
        #sidebar {
            width: 72px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-light);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #sidebar:hover { width: 280px; }
        .sidebar-expanded #sidebar { width: 280px; }

        /* 對話內容區塊 */
        .message-block {
            padding: 2rem 1.5rem;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        .ai-message { background-color: transparent; }
        .user-message { background-color: #F7F7F7; border-radius: 24px; }

        /* Markdown 樣式 */
        .prose { 
            font-size: 16px; 
            line-height: 1.625; 
            color: var(--text-primary);
        }
        .prose h1, .prose h2, .prose h3 { font-weight: 700; margin-top: 1.5em; }
        .prose code { 
            background: #F0F0F0; 
            padding: 0.2em 0.4em; 
            border-radius: 6px; 
            font-size: 0.9em; 
            font-family: 'Fira Code', monospace; 
        }
        .prose pre {
            background: #1A1A1A;
            color: #E3E3E3;
            padding: 1.25rem;
            border-radius: 16px;
            margin: 1.5rem 0;
            position: relative;
            overflow-x: auto;
        }

        /* 浮動輸入框 */
        #input-container {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            background: white;
            border: 1px solid var(--border-light);
            border-radius: 28px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            z-index: 50;
            transition: all 0.2s ease;
        }
        #input-container:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 10px 40px rgba(0, 122, 255, 0.1);
        }

        /* 自定義按鈕 */
        .action-chip {
            padding: 6px 12px;
            border: 1px solid var(--border-light);
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all 0.2s;
            display: flex;
            items-center: center;
            gap: 6px;
        }
        .action-chip:hover {
            background: #F0F0F0;
            color: var(--text-primary);
        }

        /* 隱藏滾動條 */
        .hide-scrollbar::-webkit-scrollbar { display: none; }

        /* 加載動畫 */
        .dot-flashing {
            position: relative;
            width: 6px;
            height: 6px;
            border-radius: 5px;
            background-color: var(--accent-blue);
            animation: dot-flashing 1s infinite linear alternate;
            animation-delay: 0.5s;
        }
        .dot-flashing::before, .dot-flashing::after {
            content: ""; display: inline-block; position: absolute; top: 0;
            width: 6px; height: 6px; border-radius: 5px; background-color: var(--accent-blue);
            animation: dot-flashing 1s infinite linear alternate;
        }
        .dot-flashing::before { left: -12px; animation-delay: 0s; }
        .dot-flashing::after { left: 12px; animation-delay: 1s; }
        @keyframes dot-flashing { 0% { background-color: var(--accent-blue); } 50%, 100% { background-color: #EBEBEB; } }

        /* Artifact 預覽 */
        #preview-modal { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- 1. 極簡側邊欄 (anygen.io 模式) -->
    <aside id="sidebar" class="group flex flex-col items-center py-6 shrink-0 z-40 overflow-hidden">
        <div class="mb-8 flex items-center justify-center">
            <div class="w-10 h-10 rounded-2xl bg-black flex items-center justify-center group-hover:scale-110 transition-transform cursor-pointer">
                <span class="material-symbols-rounded text-white">bolt</span>
            </div>
        </div>

        <nav class="flex-1 flex flex-col gap-4 w-full px-3">
            <button onclick="startNewSession()" class="flex items-center gap-4 p-3 rounded-2xl hover:bg-gray-100 transition-colors w-full group/item" title="新對話">
                <span class="material-symbols-rounded text-gray-500 group-hover/item:text-black">add</span>
                <span class="opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap font-medium text-sm">開啟新對話</span>
            </button>
            <div class="h-px bg-gray-200 mx-3 my-2"></div>
            <div id="session-list" class="flex-1 overflow-y-auto hide-scrollbar space-y-1"></div>
        </nav>

        <div class="mt-auto flex flex-col gap-4 w-full px-3">
            <button onclick="switchRightPanel('settings')" class="flex items-center gap-4 p-3 rounded-2xl hover:bg-gray-100 transition-colors w-full group/item" title="設定">
                <span class="material-symbols-rounded text-gray-500 group-hover/item:text-black">settings</span>
                <span class="opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap font-medium text-sm">系統設定</span>
            </button>
        </nav>
    </aside>

    <!-- 2. 主對話區 -->
    <main class="flex-1 flex flex-col relative bg-white overflow-hidden">
        
        <!-- 頂部導航 -->
        <header class="h-16 flex items-center justify-between px-8 bg-white/80 backdrop-blur-md z-30 shrink-0">
            <div class="flex items-center gap-6">
                <div class="flex flex-col">
                    <span id="current-workspace-name" class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-0.5">Workspace</span>
                    <select id="workspace-selector" onchange="changeWorkspace()" class="text-sm font-bold bg-transparent outline-none cursor-pointer hover:text-blue-600 transition-colors appearance-none">
                        <option value="">載入中...</option>
                    </select>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 px-3 py-1.5 bg-gray-50 rounded-full border border-gray-200">
                    <span class="material-symbols-rounded text-blue-500 text-sm">diamond</span>
                    <select id="gem-selector" class="bg-transparent text-xs font-bold outline-none cursor-pointer">
                        <option value="">全能助理</option>
                    </select>
                </div>
                <button onclick="switchRightPanel('library')" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors border border-gray-200" title="專案圖書館">
                    <span class="material-symbols-rounded text-gray-600">book</span>
                </button>
            </div>
        </header>

        <!-- 對話內容區 -->
        <div id="chat-container" class="flex-1 overflow-y-auto px-4 pt-12 pb-64 space-y-2 scroll-smooth">
            <!-- 歡迎訊息 -->
            <div class="message-block ai-message text-center">
                <h1 class="text-4xl font-bold tracking-tight mb-4">今天想聊些什麼？</h1>
                <p class="text-gray-400 text-lg">您的 anyGem 代理人已就緒，支援文件分析、簡報生成與視覺化思考。</p>
            </div>
        </div>

        <!-- 3. 浮動輸入區域 -->
        <div id="input-container" class="flex flex-col p-4">
            
            <!-- 上傳預覽區 -->
            <div id="upload-preview-container" class="hidden flex flex-wrap gap-2 mb-3">
                <div class="relative group">
                    <img id="image-preview" class="hidden h-20 w-20 object-cover rounded-2xl border border-gray-200 shadow-md">
                    <div id="doc-preview" class="hidden flex items-center gap-3 bg-gray-50 p-4 rounded-2xl border border-gray-200 shadow-sm">
                        <span class="material-symbols-rounded text-blue-500">description</span>
                        <span id="doc-filename" class="text-sm font-bold text-gray-700"></span>
                    </div>
                    <button onclick="clearUpload()" class="absolute -top-2 -right-2 bg-black text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity"><span class="material-symbols-rounded text-xs block">close</span></button>
                </div>
            </div>

            <!-- 文字輸入區 -->
            <div class="flex items-end gap-2">
                <button onclick="document.getElementById('file-upload').click()" class="p-2 text-gray-400 hover:text-black transition-colors rounded-full" title="上傳檔案 (PDF, Docx, Pptx)">
                    <span class="material-symbols-rounded">attach_file</span>
                </button>
                <input type="file" id="file-upload" class="hidden" onchange="handleFileUpload(event)">
                
                <textarea id="user-input" rows="1" placeholder="輸入指令或拖放檔案..." class="flex-1 py-3 px-2 bg-transparent outline-none resize-none text-lg text-gray-800 placeholder-gray-300 min-h-[50px] max-h-60" oninput="autoResize(this)"></textarea>
                
                <div class="flex items-center gap-1 mb-1">
                    <button id="mic-btn" onclick="toggleRecording()" class="p-2 text-gray-400 hover:text-red-500 transition-colors rounded-full">
                        <span class="material-symbols-rounded">mic</span>
                    </button>
                    <button id="send-btn" onclick="sendMessage()" class="w-10 h-10 flex items-center justify-center bg-black text-white rounded-full hover:scale-105 active:scale-95 transition-all shadow-lg">
                        <span class="material-symbols-rounded" id="send-icon">arrow_upward</span>
                    </button>
                </div>
            </div>

            <!-- 底部動作按鈕 -->
            <div class="flex items-center gap-2 mt-3 pt-3 border-t border-gray-50">
                <div class="relative flex items-center shrink-0">
                    <select id="model-selector" class="appearance-none action-chip outline-none cursor-pointer pr-8">
                        <option value="">🧠 預設模型 (自動)</option>
                    </select>
                    <span class="absolute right-3 text-gray-400 material-symbols-rounded text-[14px] pointer-events-none">expand_more</span>
                </div>
                <div class="h-4 w-px bg-gray-200 mx-1"></div>
                <button onclick="switchRightPanel('settings')" class="action-chip"><span class="material-symbols-rounded text-[14px]">tune</span> 偏好設定</button>
                <button onclick="createNewWorkspace()" class="action-chip"><span class="material-symbols-rounded text-[14px]">add_circle</span> 新建空間</button>
            </div>
        </div>
    </main>

    <!-- 4. 右側圖書館面板 -->
    <aside id="right-panel" class="fixed right-0 top-0 h-full w-[400px] bg-white border-l border-gray-100 shadow-2xl transform translate-x-full transition-transform duration-300 z-50 flex flex-col">
        <div class="p-6 border-b border-gray-50 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="material-symbols-rounded text-blue-500" id="panel-icon">inventory_2</span>
                <h3 class="font-bold text-lg" id="panel-title">專案圖書館</h3>
            </div>
            <button onclick="toggleRightPanel()" class="p-2 hover:bg-gray-100 rounded-full text-gray-400 transition-colors"><span class="material-symbols-rounded">close</span></button>
        </div>
        <div id="right-panel-content" class="flex-1 overflow-y-auto p-6 space-y-8"></div>
    </aside>

    <!-- 5. Artifact 預覽視窗 -->
    <div id="preview-modal" class="fixed inset-0 z-[60] hidden flex-col">
        <div class="h-16 flex items-center justify-between px-8 border-b border-gray-100 bg-white/80 backdrop-blur-md">
            <div class="flex items-center gap-3">
                <span class="material-symbols-rounded text-blue-500">deployed_code</span>
                <span class="font-bold">Artifact Preview</span>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="refreshPreview()" class="p-2 text-gray-400 hover:text-black"><span class="material-symbols-rounded">refresh</span></button>
                <button onclick="closePreview()" class="w-10 h-10 flex items-center justify-center bg-gray-100 hover:bg-red-500 hover:text-white rounded-full transition-all"><span class="material-symbols-rounded">close</span></button>
            </div>
        </div>
        <div class="flex-1 bg-white relative">
            <iframe id="preview-iframe" sandbox="allow-scripts allow-forms allow-modals" class="w-full h-full border-none absolute inset-0"></iframe>
        </div>
    </div>

    <!-- 診斷對話框 (隱藏，出錯時彈出) -->
    <div id="diagnostic-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/20 backdrop-blur-sm p-4">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl border border-red-50">
            <div class="flex items-center gap-3 text-red-500 mb-4">
                <span class="material-symbols-rounded text-3xl">report_problem</span>
                <h3 class="text-xl font-bold">連線失敗診斷</h3>
            </div>
            <p class="text-gray-500 mb-6 text-sm leading-relaxed" id="diagnostic-msg"></p>
            <div class="bg-gray-50 p-4 rounded-2xl mb-6 font-mono text-[10px] break-all border border-gray-100" id="diagnostic-details"></div>
            <button onclick="location.reload()" class="w-full py-4 bg-black text-white rounded-2xl font-bold hover:scale-[1.02] active:scale-[0.98] transition-all">重新載入</button>
        </div>
    </div>

    <script>
        // 🚀 核心設定 (請務必確認此網址正確)
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyNEz6Kv6WOEEif3Ghjt8fd-IXRt6f6BxV7dg2SXSwTn6dJsP5lgwVuCgslHSdBbD4C/exec";

        // 全域變數
        let currentSessionId = generateUUID();
        let currentWorkspace = "";
        let currentImageData = null, currentMimeType = null, currentDocumentText = null, currentDocumentName = null;
        let isWaiting = false, currentRenderCode = "", abortController = null, currentGemsList = [];
        let sharedKnowledgeSet = new Set();

        // 1. 初始化
        window.onload = async () => {
            console.log("🚀 System Booting...");
            await loadWorkspaces();
            loadSessions();
            loadGems();
            loadModels();
        };

        // 2. 通訊邏輯 (加強錯誤診斷)
        async function fetchGAS(action, payload = {}) {
            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ ...payload, action })
                });
                if (!response.ok) throw new Error(`HTTP 錯誤! 狀態碼: ${response.status}`);
                return await response.json();
            } catch (err) {
                console.error(`❌ Action [${action}] failed:`, err);
                showDiagnostic(`連線至後端時發生錯誤。\n\n可能原因：\n1. GAS 網址不正確\n2. GAS 未部署為「任何人」均可存取\n3. 瀏覽器 CORS 限制`, err.message);
                throw err;
            }
        }

        function showDiagnostic(msg, details) {
            document.getElementById('diagnostic-msg').innerText = msg;
            document.getElementById('diagnostic-details').innerText = details;
            document.getElementById('diagnostic-modal').classList.remove('hidden');
            document.getElementById('diagnostic-modal').classList.add('flex');
        }

        // 3. UI 互動
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight > 240 ? 240 : textarea.scrollHeight) + 'px';
        }

        function generateUUID() { return 'xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); }); }

        function scrollToBottom() {
            const container = document.getElementById('chat-container');
            container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
        }

        // 4. 對話管理
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text && !currentImageData && !currentDocumentText) return;
            if (isWaiting) { stopGeneration(); return; }

            const userMsg = text;
            appendMessage('user', userMsg, currentImageData);
            
            input.value = '';
            autoResize(input);
            toggleSendButton(true);
            const lid = appendLoading();
            abortController = new AbortController();

            try {
                const gemSelector = document.getElementById('gem-selector');
                const modelSelector = document.getElementById('model-selector');
                let gemPrompt = null, gemModel = null;
                if (gemSelector.value !== "") {
                    gemPrompt = currentGemsList[parseInt(gemSelector.value)].prompt;
                    gemModel = currentGemsList[parseInt(gemSelector.value)].model;
                }

                const data = await fetchGAS('chat', {
                    message: text,
                    session_id: currentSessionId,
                    workspace: currentWorkspace,
                    file_data: currentImageData ? currentImageData.split(',')[1] : null,
                    mime_type: currentMimeType,
                    selected_model: modelSelector.value,
                    gem_prompt: gemPrompt,
                    gem_model: gemModel
                });

                removeLoading(lid);
                if (data.status === "error") throw new Error(data.error || "伺服器錯誤");
                
                if (data.reply) {
                    appendMessage('ai', data.reply, data.image ? `data:${data.mime};base64,${data.image}` : null, data.model);
                    speakText(data.reply, true);
                }
                loadSessions();
            } catch (err) {
                removeLoading(lid);
                if (err.name !== 'AbortError') {
                    appendMessage('ai', `❌ 執行失敗：\n${err.message}`);
                }
            } finally {
                toggleSendButton(false);
                clearUpload();
            }
        }

        function toggleSendButton(waiting) {
            isWaiting = waiting;
            const icon = document.getElementById('send-icon');
            const btn = document.getElementById('send-btn');
            icon.innerText = waiting ? 'stop' : 'arrow_upward';
            btn.className = waiting ? "w-10 h-10 flex items-center justify-center bg-red-500 text-white rounded-full hover:scale-105 transition-all shadow-lg" : "w-10 h-10 flex items-center justify-center bg-black text-white rounded-full hover:scale-105 transition-all shadow-lg";
        }

        function stopGeneration() { if (abortController) abortController.abort(); }

        // 5. 訊息渲染 (anygen.io 極簡版)
        function appendMessage(role, text, imageSrc = null, model = null) {
            const container = document.getElementById('chat-container');
            const isAI = role === 'ai';
            const block = document.createElement('div');
            block.className = `message-block ${isAI ? 'ai-message' : 'user-message shadow-sm border border-gray-100'}`;
            
            let contentHtml = '';
            if (model && isAI) contentHtml += `<div class="text-[10px] font-bold text-gray-300 uppercase tracking-widest mb-3">Model: ${model}</div>`;
            if (imageSrc) contentHtml += `<img src="${imageSrc}" class="rounded-2xl border border-gray-100 mb-4 max-w-full shadow-md">`;
            
            const parsedText = isAI ? marked.parse(text) : text.replace(/\n/g, '<br>');
            contentHtml += `<div class="prose prose-slate max-w-none">${parsedText}</div>`;
            
            // 操作按鈕
            if (isAI) {
                contentHtml += `
                    <div class="flex items-center gap-3 mt-6 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="copyText(this)" class="p-2 text-gray-400 hover:text-black transition-colors" title="複製"><span class="material-symbols-rounded text-[18px]">content_copy</span></button>
                        <button onclick="speakMessage(this)" class="p-2 text-gray-400 hover:text-green-500 transition-colors" title="朗讀"><span class="material-symbols-rounded text-[18px]">volume_up</span></button>
                    </div>
                `;
            }

            block.innerHTML = contentHtml;
            block.classList.add('group');
            container.appendChild(block);

            // 處理代碼預覽
            if (isAI) {
                block.querySelectorAll('pre code').forEach(c => {
                    if (c.className.includes('language-html') || c.className.includes('language-jsx')) {
                        const btn = document.createElement('button');
                        btn.className = "absolute top-4 right-4 bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded-full flex items-center gap-1 shadow-lg hover:bg-blue-500 transition-all";
                        btn.innerHTML = '<span class="material-symbols-rounded text-[14px]">play_circle</span> 預覽';
                        btn.onclick = () => openPreview(c.innerText);
                        c.parentElement.appendChild(btn);
                    }
                });
            }

            scrollToBottom();
        }

        function appendLoading() {
            const container = document.getElementById('chat-container');
            const d = document.createElement('div');
            d.id = 'loader-' + Date.now();
            d.className = "message-block ai-message flex items-center justify-center py-12";
            d.innerHTML = `<div class="dot-flashing"></div>`;
            container.appendChild(d);
            scrollToBottom();
            return d.id;
        }

        function removeLoading(id) { const el = document.getElementById(id); if (el) el.remove(); }

        // 6. 系統功能 (Workspaces, Sessions)
        async function loadWorkspaces() {
            try {
                const data = await fetchGAS('get_workspaces', { mode: 'system' });
                if (data && data.workspaces) {
                    const sel = document.getElementById('workspace-selector');
                    sel.innerHTML = data.workspaces.map(ws => `<option value="${ws}">${ws}</option>`).join('');
                    if (!currentWorkspace) {
                        currentWorkspace = data.workspaces[0];
                        sel.value = currentWorkspace;
                    }
                    document.getElementById('current-workspace-name').innerText = currentWorkspace;
                }
            } catch (e) { console.error("Workspace load failed", e); }
        }

        function changeWorkspace() {
            currentWorkspace = document.getElementById('workspace-selector').value;
            document.getElementById('current-workspace-name').innerText = currentWorkspace;
            startNewSession();
        }

        function createNewWorkspace() {
            const name = prompt("請輸入新專案空間名稱：");
            if (name && name.trim()) {
                currentWorkspace = name.trim();
                const sel = document.getElementById('workspace-selector');
                const opt = document.createElement('option');
                opt.value = opt.text = currentWorkspace;
                sel.add(opt);
                sel.value = currentWorkspace;
                changeWorkspace();
            }
        }

        async function loadSessions() {
            try {
                const data = await fetchGAS('get_session_list', { mode: 'system', workspace: currentWorkspace });
                const list = document.getElementById('session-list');
                list.innerHTML = '';
                if (data.sessions) {
                    data.sessions.forEach(s => {
                        const item = document.createElement('button');
                        const active = s.id === currentSessionId;
                        item.className = `w-full flex items-center gap-4 p-3 rounded-2xl transition-all group/session ${active ? 'bg-gray-100' : 'hover:bg-gray-50'}`;
                        item.innerHTML = `
                            <span class="material-symbols-rounded text-gray-400 ${active ? 'text-black' : ''} text-[20px]">${s.pinned ? 'push_pin' : 'chat'}</span>
                            <span class="opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap overflow-hidden text-ellipsis text-xs font-semibold ${active ? 'text-black' : 'text-gray-500'}">${s.title}</span>
                        `;
                        item.onclick = () => switchSession(s.id, s.title);
                        list.appendChild(item);
                    });
                }
            } catch (e) {}
        }

        async function switchSession(id, title) {
            currentSessionId = id;
            document.getElementById('chat-container').innerHTML = '';
            const lid = appendLoading();
            try {
                const data = await fetchGAS('load_session', { mode: 'system', session_id: id, workspace: currentWorkspace });
                removeLoading(lid);
                if (data.logs) {
                    data.logs.forEach(l => appendMessage(l.role === 'ai' ? 'ai' : 'user', l.text));
                }
                loadSessions();
            } catch (e) { removeLoading(lid); }
        }

        function startNewSession() {
            currentSessionId = generateUUID();
            document.getElementById('chat-container').innerHTML = `
                <div class="message-block ai-message text-center">
                    <h1 class="text-4xl font-bold tracking-tight mb-4">今天想聊些什麼？</h1>
                    <p class="text-gray-400 text-lg">您已切換至 **${currentWorkspace}** 空間。</p>
                </div>
            `;
            loadSessions();
        }

        // 7. 檔案處理
        async function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            
            if (file.type.startsWith('image/')) {
                reader.onload = (ev) => {
                    currentImageData = ev.target.result;
                    currentMimeType = file.type;
                    const img = document.getElementById('image-preview');
                    img.src = currentImageData;
                    img.classList.remove('hidden');
                    document.getElementById('doc-preview').classList.add('hidden');
                    document.getElementById('upload-preview-container').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            } else {
                // 文檔處理簡化版，實際執行時會根據副檔名呼叫不同解析引擎
                currentDocumentName = file.name;
                document.getElementById('doc-filename').innerText = file.name;
                document.getElementById('doc-preview').classList.remove('hidden');
                document.getElementById('image-preview').classList.add('hidden');
                document.getElementById('upload-preview-container').classList.remove('hidden');
                
                // 這裡保留您原本的解析邏輯接口
                reader.onload = (ev) => { currentDocumentText = ev.target.result; };
                reader.readAsText(file);
            }
        }

        function clearUpload() {
            currentImageData = currentMimeType = currentDocumentText = currentDocumentName = null;
            document.getElementById('upload-preview-container').classList.add('hidden');
            document.getElementById('file-upload').value = '';
        }

        // 8. 其他輔助功能
        async function loadGems() {
            try {
                const data = await fetchGAS('get_gems', { mode: 'system', workspace: currentWorkspace });
                if (data.gems) {
                    currentGemsList = data.gems;
                    const sel = document.getElementById('gem-selector');
                    sel.innerHTML = '<option value="">🤖 全能助理</option>' + data.gems.map((g, i) => `<option value="${i}">💎 ${g.name}</option>`).join('');
                }
            } catch (e) {}
        }

        async function loadModels() {
            try {
                const data = await fetchGAS('get_models', { mode: 'system', workspace: currentWorkspace });
                if (data.models) {
                    const sel = document.getElementById('model-selector');
                    sel.innerHTML = '<option value="">🧠 預設模型 (自動)</option>' + data.models.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
                }
            } catch (e) {}
        }

        function copyText(btn) {
            const text = btn.closest('.message-block').querySelector('.prose').innerText;
            navigator.clipboard.writeText(text);
            const icon = btn.querySelector('.material-symbols-rounded');
            icon.innerText = 'check';
            setTimeout(() => icon.innerText = 'content_copy', 2000);
        }

        // 9. 右側面板控制
        let currentRightTab = 'library';
        function toggleRightPanel() {
            const panel = document.getElementById('right-panel');
            panel.classList.toggle('translate-x-full');
        }

        function switchRightPanel(tab) {
            currentRightTab = tab;
            const title = document.getElementById('panel-title');
            const icon = document.getElementById('panel-icon');
            const content = document.getElementById('right-panel-content');
            
            if (tab === 'library') {
                title.innerText = '專案圖書館';
                icon.innerText = 'inventory_2';
                content.innerHTML = `<div class="p-8 text-center text-gray-400 italic">正在載入專案資料來源...</div>`;
                loadSources();
            } else {
                title.innerText = '偏好設定';
                icon.innerText = 'tune';
                content.innerHTML = `
                    <div class="space-y-6">
                        <label class="flex items-center justify-between p-4 bg-gray-50 rounded-2xl cursor-pointer">
                            <span class="text-sm font-bold">自動簡報配圖</span>
                            <input type="checkbox" id="auto-image-toggle" class="w-5 h-5 accent-black">
                        </label>
                        <label class="flex items-center justify-between p-4 bg-gray-50 rounded-2xl cursor-pointer">
                            <span class="text-sm font-bold">語音自動播報</span>
                            <input type="checkbox" id="voice-output-toggle" class="w-5 h-5 accent-black">
                        </label>
                    </div>
                `;
            }
            toggleRightPanel();
        }

        async function loadSources() {
            try {
                const data = await fetchGAS('get_sources', { mode: 'system', workspace: currentWorkspace });
                const container = document.getElementById('right-panel-content');
                if (data.sources && data.sources.length > 0) {
                    container.innerHTML = data.sources.map(s => `
                        <div class="flex items-center gap-4 p-4 hover:bg-gray-50 rounded-2xl transition-colors border border-gray-50 cursor-pointer" onclick="window.open('${s.url}', '_blank')">
                            <span class="material-symbols-rounded text-blue-500">${s.type === 'youtube' ? 'subscriptions' : 'public'}</span>
                            <div class="flex-1 min-w-0"><div class="text-sm font-bold truncate">${s.title}</div><div class="text-[10px] text-gray-400 truncate">${s.url}</div></div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = `<div class="p-12 text-center text-gray-300 italic">尚無來源資料</div>`;
                }
            } catch (e) {}
        }

        // 10. 預覽與縮放
        function openPreview(code) {
            document.getElementById('preview-iframe').srcdoc = code;
            document.getElementById('preview-modal').classList.remove('hidden');
            document.getElementById('preview-modal').classList.add('flex');
        }
        function closePreview() { document.getElementById('preview-modal').classList.add('hidden'); }
        function refreshPreview() { document.getElementById('preview-iframe').contentWindow.location.reload(); }

        // 語音播放簡化
        function speakText(text, auto = false) {
            if (auto && !document.getElementById('voice-output-toggle')?.checked) return;
            const utterance = new SpeechSynthesisUtterance(text.replace(/[*#_]/g, ''));
            utterance.lang = 'zh-TW';
            window.speechSynthesis.speak(utterance);
        }

    </script>
</body>
</html>
