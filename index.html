<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manus Agent (GAS Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Custom scrollbar for terminal feel */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
        .markdown-body h1 { font-size: 1.5em; font-weight: bold; margin-bottom: 0.5em; }
        .markdown-body h2 { font-size: 1.25em; font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.5em; margin-bottom: 1em; }
        .markdown-body code { background: #374151; padding: 0.1em 0.3em; border-radius: 0.2em; font-family: monospace; }
        .markdown-body pre code { background: transparent; padding: 0; }
        .markdown-body pre { background: #1f2937; padding: 1em; border-radius: 0.5em; overflow-x: auto; margin-bottom: 1em; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header -->
    <header class="border-b border-gray-800 bg-gray-950 px-6 py-3 flex justify-between items-center z-10 shadow-md">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 rounded-full bg-green-500 shadow-[0_0_8px_#22c55e]"></div>
            <h1 class="text-xl font-bold tracking-wider text-gray-200">MANUS<span class="text-gray-500 font-light"> // AGENT</span></h1>
        </div>
        <div class="text-xs font-mono text-gray-500">v2.0 Asynchronous Core</div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- Left Panel: Chat & Reports -->
        <section class="w-1/2 flex flex-col border-r border-gray-800 bg-gray-900 relative">
            <div id="chat-history" class="flex-1 overflow-y-auto p-6 space-y-6 pb-24">
                <div class="text-center text-gray-500 mt-10">
                    <p class="text-lg mb-2">👋 歡迎來到新一代的自主代理人系統</p>
                    <p class="text-sm">請在下方輸入您的任務。系統將自動拆解步驟、編寫程式碼並執行。</p>
                </div>
            </div>
            
            <!-- Input Area -->
            <div class="absolute bottom-0 w-full bg-gradient-to-t from-gray-900 via-gray-900 to-transparent p-6 pt-10">
                <div class="relative flex items-center">
                    <textarea id="user-input" rows="1" class="w-full bg-gray-800 border border-gray-700 text-white rounded-xl pl-4 pr-12 py-3 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent resize-none overflow-hidden" placeholder="請描述您的任務 (例如: 幫我找5篇關於AI的最新文章並做成表格)..."></textarea>
                    <button id="send-btn" onclick="sendTask()" class="absolute right-2 p-2 bg-green-600 hover:bg-green-500 text-white rounded-lg transition-colors duration-200 focus:outline-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                        </svg>
                    </button>
                </div>
            </div>
        </section>

        <!-- Right Panel: Agent Terminal Logs -->
        <section class="w-1/2 bg-[#0a0a0a] flex flex-col font-mono text-sm relative shadow-inner">
            <div class="px-4 py-2 bg-[#111] border-b border-gray-800 flex justify-between items-center text-xs">
                <div class="flex space-x-2">
                    <span class="text-gray-400">Terminal</span>
                    <span class="text-gray-600">|</span>
                    <span id="task-id-display" class="text-gray-500">No active task</span>
                </div>
                <div id="status-indicator" class="flex items-center space-x-2 text-green-500">
                    <span>IDLE</span>
                </div>
            </div>
            <div id="agent-logs" class="flex-1 overflow-y-auto p-5 space-y-1.5 text-gray-300 pb-10">
                <div class="text-green-600">> System initialized. Waiting for task payload...</div>
            </div>
        </section>
    </main>

    <script>
        // ⚠️ 部署前，請務必將下方的網址替換為您的 Google Apps Script Web App URL ⚠️
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxSZcAOsBTfgJuoX_xFkMxYDxs-eP1HobNFSoVi8Wk/exec";

        
        let currentTaskId = null;
        let isPolling = false;

        const chatBox = document.getElementById('chat-history');
        const logBox = document.getElementById('agent-logs');
        const inputField = document.getElementById('user-input');
        const statusInd = document.getElementById('status-indicator');
        const taskIdDisplay = document.getElementById('task-id-display');

        // Auto-resize textarea
        inputField.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight < 120 ? this.scrollHeight : 120) + 'px';
        });

        inputField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendTask();
            }
        });

        function appendChat(role, text) {
            const div = document.createElement('div');
            div.className = "flex w-full " + (role === 'user' ? "justify-end" : "justify-start");
            
            const inner = document.createElement('div');
            inner.className = `max-w-[85%] rounded-2xl px-5 py-4 ${role === 'user' ? 'bg-green-600 text-white shadow-lg' : 'bg-gray-800 text-gray-200 border border-gray-700 shadow-md markdown-body'}`;
            
            if (role === 'user') {
                inner.innerText = text;
            } else {
                inner.innerHTML = marked.parse(text);
            }
            
            div.appendChild(inner);
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function renderLogs(logsArray) {
            logBox.innerHTML = ''; // Clear and re-render for simplicity
            logsArray.forEach(log => {
                const div = document.createElement('div');
                if (log.startsWith('[Thought]')) {
                    div.className = 'text-blue-400 opacity-90';
                    div.innerText = '> ' + log;
                } else if (log.startsWith('[Action]')) {
                    div.className = 'text-yellow-400 font-bold';
                    div.innerText = '> ' + log;
                } else if (log.startsWith('[Observation]')) {
                    div.className = 'text-gray-400 italic pl-4 border-l-2 border-gray-700 my-1';
                    div.innerText = log;
                } else if (log.startsWith('[Error]')) {
                    div.className = 'text-red-500 font-bold';
                    div.innerText = '> ' + log;
                } else {
                    div.className = 'text-green-500';
                    div.innerText = log;
                }
                logBox.appendChild(div);
            });
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function sendTask() {
            if (isPolling) return alert("目前已有任務正在執行中！請稍候。");
            
            const msg = inputField.value.trim();
            if (!msg) return;
            
            appendChat('user', msg);
            inputField.value = '';
            inputField.style.height = 'auto';
            
            setAgentStatus('INITIALIZING', 'text-yellow-500 animate-pulse');
            logBox.innerHTML = '<div class="text-green-600">> 建立全新任務...</div>';
            
            try {
                logBox.innerHTML += `<div class="text-gray-500">> 正在進行基礎連線測試 (GET)...</div>`;
                const pingRes = await fetch(GAS_URL + "?action=ping", {
                    method: 'GET',
                    mode: 'cors'
                }).then(r => r.json());
                
                if (pingRes.status === 'pong') {
                    logBox.innerHTML += `<div class="text-green-500">> 基礎連線測試成功 (PONG)!</div>`;
                } else {
                    logBox.innerHTML += `<div class="text-yellow-500">> 連線回應異常: ${JSON.stringify(pingRes)}</div>`;
                }
            } catch(e) {
                logBox.innerHTML += `<div class="text-red-500">> 基礎連線測試失敗: ${e.message}</div>`;
                logBox.innerHTML += `<div class="text-xs text-gray-600 pl-4">提示: 請確認是否登入多個 Google 帳號，或嘗試使用無痕模式。</div>`;
                return; // Stop if ping fails
            }

            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'start_task', prompt: msg })
                }).then(r => r.json());
                
                if (res.status === 'success') {
                    currentTaskId = res.taskId;
                    taskIdDisplay.innerText = currentTaskId;
                    isPolling = true;
                    setAgentStatus('THINKING & EXECUTING', 'text-yellow-500 animate-pulse');
                    pollStep();
                } else {
                    setAgentStatus('ERROR', 'text-red-500');
                    logBox.innerHTML += `<div class="text-red-500">> 任務建立失敗: ${res.error}</div>`;
                }
            } catch (err) {
                setAgentStatus('ERROR', 'text-red-500');
                logBox.innerHTML += `<div class="text-red-500">> 連線異常: ${err.message}</div>`;
            }
        }

        function setAgentStatus(text, classes) {
            statusInd.className = `flex items-center space-x-2 font-bold ${classes}`;
            statusInd.innerHTML = `
                ${text !== 'IDLE' && text !== 'ERROR' ? '<svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>' : ''}
                <span>${text}</span>
            `;
        }

        async function pollStep() {
            if (!currentTaskId || !isPolling) return;
            
            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'run_step', taskId: currentTaskId })
                }).then(r => r.json());
                
                if (res.logs && res.logs.length > 0) {
                    renderLogs(res.logs);
                }
                
                if (res.status === 'completed') {
                    isPolling = false;
                    setAgentStatus('IDLE', 'text-green-500');
                    if (res.final_answer) {
                        appendChat('agent', res.final_answer);
                    }
                    currentTaskId = null;
                    taskIdDisplay.innerText = 'No active task';
                } else if (res.status === 'running') {
                    // Keep polling
                    setTimeout(pollStep, 1500); 
                } else {
                    isPolling = false;
                    setAgentStatus('ERROR', 'text-red-500');
                    logBox.innerHTML += `<div class="text-red-500">> 錯誤: ${res.error || '未知的任務狀態'}</div>`;
                }
            } catch(e) {
                logBox.innerHTML += `<div class="text-yellow-500">> 連線異常，正在重試... (${e.message})</div>`;
                setTimeout(pollStep, 3000); 
            }
        }
    </script>
</body>
</html>
