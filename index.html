<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>anyGem Agent - Intelligence Redefined</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --sidebar-bg: #FAFAFA;
            --chat-bg: #FFFFFF;
            --text-primary: #1A1A1A;
            --text-secondary: #5D5D5D;
            --accent-blue: #007AFF;
            --border-light: rgba(26, 26, 26, 0.1);
        }

        body { 
            background-color: var(--chat-bg); 
            color: var(--text-primary); 
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* 側邊欄窄化設計 */
        #sidebar {
            width: 72px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-light);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #sidebar:hover { width: 280px; }
        .sidebar-expanded #sidebar { width: 280px; }

        /* 對話內容區塊 */
        .message-block {
            padding: 2rem 1.5rem;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        .ai-message { background-color: transparent; }
        .user-message { background-color: #F7F7F7; border-radius: 24px; }

        /* Markdown 樣式 */
        .prose { 
            font-size: 16px; 
            line-height: 1.625; 
            color: var(--text-primary);
        }
        .prose h1, .prose h2, .prose h3 { font-weight: 700; margin-top: 1.5em; }
        .prose code { 
            background: #F0F0F0; 
            padding: 0.2em 0.4em; 
            border-radius: 6px; 
            font-size: 0.9em; 
            font-family: 'Fira Code', monospace; 
        }
        .prose pre {
            background: #1A1A1A;
            color: #E3E3E3;
            padding: 1.25rem;
            border-radius: 16px;
            margin: 1.5rem 0;
            position: relative;
            overflow-x: auto;
        }

        /* 浮動輸入框 */
        #input-container {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            background: white;
            border: 1px solid var(--border-light);
            border-radius: 28px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            z-index: 50;
            transition: all 0.2s ease;
        }
        #input-container:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 10px 40px rgba(0, 122, 255, 0.1);
        }

        /* 自定義按鈕 */
        .action-chip {
            padding: 6px 12px;
            border: 1px solid var(--border-light);
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all 0.2s;
            display: flex;
            items-center: center;
            gap: 6px;
        }
        .action-chip:hover {
            background: #F0F0F0;
            color: var(--text-primary);
        }

        /* 隱藏滾動條 */
        .hide-scrollbar::-webkit-scrollbar { display: none; }

        /* 加載動畫 */
        .dot-flashing {
            position: relative;
            width: 6px;
            height: 6px;
            border-radius: 5px;
            background-color: var(--accent-blue);
            animation: dot-flashing 1s infinite linear alternate;
            animation-delay: 0.5s;
        }
        .dot-flashing::before, .dot-flashing::after {
            content: ""; display: inline-block; position: absolute; top: 0;
            width: 6px; height: 6px; border-radius: 5px; background-color: var(--accent-blue);
            animation: dot-flashing 1s infinite linear alternate;
        }
        .dot-flashing::before { left: -12px; animation-delay: 0s; }
        .dot-flashing::after { left: 12px; animation-delay: 1s; }
        @keyframes dot-flashing { 0% { background-color: var(--accent-blue); } 50%, 100% { background-color: #EBEBEB; } }

        /* Artifact 預覽 */
        #preview-modal { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #D1D5DB; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- 1. 極簡側邊欄 (anygen.io 模式) -->
    <aside id="sidebar" class="group flex flex-col items-center py-6 shrink-0 z-40 overflow-hidden bg-[#FAFAFA] border-r border-gray-100 w-16 hover:w-64 transition-all duration-300 h-full">
        <div class="mb-8 flex items-center justify-center shrink-0">
            <div onclick="startNewSession()" class="w-10 h-10 rounded-2xl bg-black flex items-center justify-center group-hover:scale-110 transition-transform cursor-pointer shadow-lg active:scale-95" title="回到首頁">

        <nav class="flex-1 flex flex-col gap-2 w-full px-3 overflow-hidden">
            <!-- 🗂️ 專案空間切換 (Workspace) -->
            <div class="px-3 mb-4 opacity-0 group-hover:opacity-100 transition-opacity shrink-0">

                <div class="relative flex items-center mb-2">
                    <select id="workspace-selector" onchange="changeWorkspace()" class="w-full pl-3 pr-8 py-2 bg-white hover:bg-gray-50 text-black text-xs font-bold rounded-xl border border-gray-200 outline-none focus:border-black transition-all appearance-none cursor-pointer truncate">
                        <option value="">載入中...</option>
                    </select>
                    <span class="absolute right-2 text-gray-400 material-symbols-rounded text-[18px] pointer-events-none">expand_more</span>
                </div>
                <button onclick="createNewWorkspace()" class="text-[10px] text-blue-500 font-bold hover:underline flex items-center gap-1">
                    <span class="material-symbols-rounded text-[14px]">add_circle</span> 建立新空間
                </button>
            </div>

            <button onclick="startNewSession()" class="flex items-center gap-4 p-3 rounded-2xl hover:bg-gray-100 transition-colors w-full group/item shrink-0" title="新對話">
                <span class="material-symbols-rounded text-gray-500 group-hover/item:text-black">add</span>
                <span class="opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap font-medium text-sm">開啟新對話</span>
            </button>
            <div class="h-px bg-gray-200 mx-3 my-2 shrink-0"></div>
            
            <!-- 歷史對話列表 (The Scrollable Area) -->
            <div id="session-list" class="flex-1 overflow-y-auto custom-scrollbar space-y-1 min-h-0 pr-1">

            </div>

        <div class="mt-auto flex flex-col gap-2 w-full px-3 shrink-0">

                <span class="material-symbols-rounded text-gray-500 group-hover/item:text-black">settings</span>

        </div>
    </aside>

    <!-- 2. 主對話區 -->
    <main class="flex-1 flex flex-col relative bg-white overflow-hidden">
        
        <!-- 頂部導航 -->
        <header class="h-16 flex items-center justify-between px-8 bg-white/80 backdrop-blur-md z-30 shrink-0">
            <div class="flex items-center gap-6">
                <span class="text-lg font-bold tracking-tight">anyGem</span>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 px-3 py-1.5 bg-gray-50 rounded-full border border-gray-200">
                    <span class="material-symbols-rounded text-blue-500 text-sm">diamond</span>
                    <select id="gem-selector" class="bg-transparent text-xs font-bold outline-none cursor-pointer">

                    </select>
                </div>

                    <span class="material-symbols-rounded text-gray-600">book</span>

        </header>

        <!-- 對話內容區 -->
        <div id="chat-container" class="flex-1 overflow-y-auto px-4 pt-12 pb-64 space-y-2 scroll-smooth">
            <!-- 歡迎訊息 -->
            <div class="message-block ai-message text-center">
                <h1 class="text-4xl font-bold tracking-tight mb-4">今天想聊些什麼？</h1>
                <p class="text-gray-400 text-lg">您的 anyGem 代理人已就緒，支援文件分析、簡報生成與視覺化思考。</p>
            </div>
        </div>

        <!-- 3. 浮動輸入區域 -->
        <div id="input-container" class="flex flex-col p-4">
            
            <!-- 上傳預覽區 -->
            <div id="upload-preview-container" class="hidden flex flex-wrap gap-2 mb-3">
                <div class="relative group">
                    <img id="image-preview" class="hidden h-20 w-20 object-cover rounded-2xl border border-gray-200 shadow-md">
                    <div id="doc-preview" class="hidden flex items-center gap-3 bg-gray-50 p-4 rounded-2xl border border-gray-200 shadow-sm">
                        <span class="material-symbols-rounded text-blue-500">description</span>
                        <span id="doc-filename" class="text-sm font-bold text-gray-700"></span>
                    </div>
                    <button onclick="clearUpload()" class="absolute -top-2 -right-2 bg-black text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity"><span class="material-symbols-rounded text-xs block">close</span></button>
                </div>
            </div>

            <!-- 文字輸入區 -->
            <div class="flex items-end gap-2">
                <button onclick="document.getElementById('file-upload').click()" class="p-2 text-gray-400 hover:text-black transition-colors rounded-full" title="上傳檔案 (PDF, Docx, Pptx)">
                    <span class="material-symbols-rounded">attach_file</span>
                </button>
                <input type="file" id="file-upload" class="hidden" onchange="handleFileUpload(event)">
                
                <textarea id="user-input" rows="1" placeholder="輸入指令或拖放檔案..." class="flex-1 py-3 px-2 bg-transparent outline-none resize-none text-lg text-gray-800 placeholder-gray-300 min-h-[50px] max-h-60" oninput="autoResize(this)"></textarea>
                
                <div class="flex items-center gap-1 mb-1">
                    <button id="mic-btn" onclick="toggleRecording()" class="p-2 text-gray-400 hover:text-red-500 transition-colors rounded-full">
                        <span class="material-symbols-rounded">mic</span>
                    </button>
                    <button id="send-btn" onclick="sendMessage()" class="w-10 h-10 flex items-center justify-center bg-black text-white rounded-full hover:scale-105 active:scale-95 transition-all shadow-lg">
                        <span class="material-symbols-rounded" id="send-icon">arrow_upward</span>
                    </button>
                </div>
            </div>

            <!-- 底部動作按鈕 -->
            <div class="flex items-center gap-2 mt-3 pt-3 border-t border-gray-50">
                <div class="relative flex items-center shrink-0">
                    <select id="model-selector" class="appearance-none action-chip outline-none cursor-pointer pr-8">
                        <option value="">🧠 預設模型 (自動)</option>
                    </select>
                    <span class="absolute right-3 text-gray-400 material-symbols-rounded text-[14px] pointer-events-none">expand_more</span>
                </div>
                <div class="h-4 w-px bg-gray-200 mx-1"></div>
                <button onclick="switchRightPanel('settings')" class="action-chip"><span class="material-symbols-rounded text-[14px]">tune</span> 偏好設定</button>
                <button onclick="createNewWorkspace()" class="action-chip"><span class="material-symbols-rounded text-[14px]">add_circle</span> 新建空間</button>
            </div>
        </div>
    </main>

            </div>

            <!-- 圖書館 -->
            <div id="workbench-library-area" class="hidden flex-1 overflow-y-auto p-6">
                <div id="library-content" class="space-y-4"></div>
            </div>
        </div>
    </aside>

    <!-- 3. 系統設定彈窗 (Classic Mode Settings) -->
    <div id="settings-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center bg-black/20 backdrop-blur-sm transition-all">
        <div class="bg-white w-[400px] rounded-3xl shadow-2xl overflow-hidden border border-gray-100 animate-in fade-in zoom-in duration-300">
            <div class="p-6 border-b border-gray-50 flex items-center justify-between">
                <h3 class="font-bold text-lg flex items-center gap-2">
                    <span class="material-symbols-rounded text-blue-500">settings</span> 系統偏好設定
                </h3>
                <button onclick="closeSettings()" class="p-2 hover:bg-gray-100 rounded-full text-gray-400 transition-colors"><span class="material-symbols-rounded">close</span></button>
            </div>
            
            <div class="p-8 space-y-6">
                <!-- 1. 聯網功能 -->
                <div class="flex items-center justify-between">
                    <div>
                        <div class="font-bold text-sm">聯網搜尋功能</div>
                        <div class="text-[10px] text-gray-400">開啟後 AI 將具備即時網頁搜尋能力</div>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="setting-web-search" class="sr-only peer" onchange="saveSettings()">
                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                    </label>
                </div>

                <!-- 2. 簡報配圖模式 -->

                    <div>
                        <div class="font-bold text-sm">簡報自動配圖</div>

                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="setting-slide-image" class="sr-only peer" checked onchange="saveSettings()">
                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-600"></div>
                    </label>

                <!-- 3. 對話風格 -->

            </div>

            <div class="p-6 bg-gray-50 flex justify-center">
                <button onclick="closeSettings()" class="px-8 py-2 bg-black text-white text-xs font-bold rounded-full hover:scale-105 active:scale-95 transition-all">完成設定</button>
            </div>
        </div>
    </div>
        <div class="h-16 flex items-center justify-between px-8 border-b border-gray-100 bg-white/80 backdrop-blur-md">
            <div class="flex items-center gap-3">
                <span class="material-symbols-rounded text-blue-500">deployed_code</span>
                <span class="font-bold">Artifact Preview</span>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="refreshPreview()" class="p-2 text-gray-400 hover:text-black"><span class="material-symbols-rounded">refresh</span></button>
                <button onclick="closePreview()" class="w-10 h-10 flex items-center justify-center bg-gray-100 hover:bg-red-500 hover:text-white rounded-full transition-all"><span class="material-symbols-rounded">close</span></button>
            </div>
        </div>
        <div class="flex-1 bg-white relative">
            <iframe id="preview-iframe" sandbox="allow-scripts allow-forms allow-modals" class="w-full h-full border-none absolute inset-0"></iframe>
        </div>
    </div>

    <!-- 診斷對話框 (隱藏，出錯時彈出) -->
    <div id="diagnostic-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/20 backdrop-blur-sm p-4">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl border border-red-50">
            <div class="flex items-center gap-3 text-red-500 mb-4">
                <span class="material-symbols-rounded text-3xl">report_problem</span>
                <h3 class="text-xl font-bold">連線失敗診斷</h3>
            </div>
            <p class="text-gray-500 mb-6 text-sm leading-relaxed" id="diagnostic-msg"></p>
            <div class="bg-gray-50 p-4 rounded-2xl mb-6 font-mono text-[10px] break-all border border-gray-100" id="diagnostic-details"></div>
            <button onclick="location.reload()" class="w-full py-4 bg-black text-white rounded-2xl font-bold hover:scale-[1.02] active:scale-[0.98] transition-all">重新載入</button>
        </div>
    </div>

    <script>
        // 🚀 核心設定 (請務必確認此網址正確)
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyNEz6Kv6WOEEif3Ghjt8fd-IXRt6f6BxV7dg2SXSwTn6dJsP5lgwVuCgslHSdBbD4C/exec";

        // 全域變數
        let currentSessionId = generateUUID();
        let currentWorkspace = "";
        let currentImageData = null, currentMimeType = null, currentDocumentText = null, currentDocumentName = null;
        let isWaiting = false, currentRenderCode = "", abortController = null, currentGemsList = [];
        let sharedKnowledgeSet = new Set();

        // 1. 初始化
        window.onload = async () => {
            console.log("🚀 System Booting...");
            await loadWorkspaces();
            loadSessions();
            loadGems();
            loadModels();
        };

        // 2. 通訊邏輯 (加強錯誤診斷)
        async function fetchGAS(action, payload = {}) {
            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ ...payload, action })
                });
                if (!response.ok) throw new Error(`HTTP 錯誤! 狀態碼: ${response.status}`);
                return await response.json();
            } catch (err) {
                console.error(`❌ Action [${action}] failed:`, err);
                showDiagnostic(`連線至後端時發生錯誤。\n\n可能原因：\n1. GAS 網址不正確\n2. GAS 未部署為「任何人」均可存取\n3. 瀏覽器 CORS 限制`, err.message);
                throw err;
            }
        }

        function showDiagnostic(msg, details) {
            document.getElementById('diagnostic-msg').innerText = msg;
            document.getElementById('diagnostic-details').innerText = details;
            document.getElementById('diagnostic-modal').classList.remove('hidden');
            document.getElementById('diagnostic-modal').classList.add('flex');
        }

        // 3. UI 互動
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight > 240 ? 240 : textarea.scrollHeight) + 'px';
        }

        function generateUUID() { return 'xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); }); }

        function scrollToBottom() {
            const container = document.getElementById('chat-container');
            container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
        }

        // 4. 對話管理
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text && !currentImageData && !currentDocumentText) return;
            if (isWaiting) { stopGeneration(); return; }

            const userMsg = text;
            appendMessage('user', userMsg, currentImageData);
            
            input.value = '';
            autoResize(input);
            toggleSendButton(true);
            const lid = appendLoading();
            abortController = new AbortController();

            try {
                const gemSelector = document.getElementById('gem-selector');
                const modelSelector = document.getElementById('model-selector');
                let gemPrompt = null, gemModel = null;
                if (gemSelector.value !== "") {
                    gemPrompt = currentGemsList[parseInt(gemSelector.value)].prompt;
                    gemModel = currentGemsList[parseInt(gemSelector.value)].model;
                }

                const data = await fetchGAS('chat', {
                    message: text,
                    session_id: currentSessionId,
                    workspace: currentWorkspace,
                    file_data: currentImageData ? currentImageData.split(',')[1] : null,
                    mime_type: currentMimeType,
                    selected_model: modelSelector.value,
                    gem_prompt: gemPrompt,
                    gem_model: gemModel,
                    web_search: userSettings.webSearch,
                    auto_image: userSettings.slideImage,
                    chat_style: userSettings.chatStyle
                });

                removeLoading(lid);
                if (data.status === "error") throw new Error(data.error || "伺服器錯誤");
                
                if (data.reply) {
                    appendMessage('ai', data.reply, data.image ? `data:${data.mime};base64,${data.image}` : null, data.model);
                    speakText(data.reply, true);
                }
                loadSessions();
            } catch (err) {
                removeLoading(lid);
                if (err.name !== 'AbortError') {
                    appendMessage('ai', `❌ 執行失敗：\n${err.message}`);
                }
            } finally {
                toggleSendButton(false);
                clearUpload();
            }
        }

        function toggleSendButton(waiting) {
            isWaiting = waiting;
            const icon = document.getElementById('send-icon');
            const btn = document.getElementById('send-btn');
            icon.innerText = waiting ? 'stop' : 'arrow_upward';
            btn.className = waiting ? "w-10 h-10 flex items-center justify-center bg-red-500 text-white rounded-full hover:scale-105 transition-all shadow-lg" : "w-10 h-10 flex items-center justify-center bg-black text-white rounded-full hover:scale-105 transition-all shadow-lg";
        }

        function stopGeneration() { if (abortController) abortController.abort(); }

        // 5. 訊息渲染 (anygen.io 極簡版)
        function appendMessage(role, text, imageSrc = null, model = null) {
            const container = document.getElementById('chat-container');
            const isAI = role === 'ai';
            const block = document.createElement('div');
            block.className = `message-block ${isAI ? 'ai-message' : 'user-message shadow-sm border border-gray-100'}`;
            
            let contentHtml = '';
            if (model && isAI) contentHtml += `<div class="text-[10px] font-bold text-gray-300 uppercase tracking-widest mb-3">Model: ${model}</div>`;

        // --- 檔案解析引擎加載器 ---
        let pdfjsLibLoaded = false, mammothLoaded = false, xlsxLoaded = false, jszipLoaded = false;
        async function loadPdfJs() { if(pdfjsLibLoaded) return; return new Promise((r, j) => { let s = document.createElement('script'); s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"; s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; pdfjsLibLoaded = true; r(); }; s.onerror = j; document.head.appendChild(s); }); }
        async function loadMammoth() { if(mammothLoaded) return; return new Promise((r, j) => { let s = document.createElement('script'); s.src = "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"; s.onload = () => { mammothLoaded = true; r(); }; s.onerror = j; document.head.appendChild(s); }); }
        async function loadXlsx() { if(xlsxLoaded) return; return new Promise((r, j) => { let s = document.createElement('script'); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = () => { xlsxLoaded = true; r(); }; s.onerror = j; document.head.appendChild(s); }); }
        async function loadJszip() { if(jszipLoaded) return; return new Promise((r, j) => { let s = document.createElement('script'); s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"; s.onload = () => { jszipLoaded = true; r(); }; s.onerror = j; document.head.appendChild(s); }); }

        // --- 核心檔案處理函數 ---
        async function handleFileUpload(e) {
            const f = e.target.files[0]; if (!f) return; 
            const r = new FileReader(), ext = f.name.split('.').pop().toLowerCase();
            const lid = appendLoading(`正在處理 ${f.name}...`);

            try {
                if (f.type.startsWith('image/')) { 
                    removeLoading(lid);
                    r.onload = (ev) => { 
                        currentImageData = ev.target.result; currentMimeType = f.type; 
                        const img = document.getElementById('image-preview');
                        img.src = currentImageData; img.classList.remove('hidden'); 
                        document.getElementById('doc-preview').classList.add('hidden'); 
                        document.getElementById('upload-preview-container').classList.remove('hidden'); 
                    }; r.readAsDataURL(f); 
                } 
                else if (f.type === 'application/pdf' || ext === 'pdf') { 
                    await loadPdfJs(); 
                    r.onload = async (ev) => { 
                        try { 
                            const pdf = await pdfjsLib.getDocument(new Uint8Array(ev.target.result)).promise; 
                            let t = ""; for (let i=1; i<=pdf.numPages; i++) t += (await (await pdf.getPage(i)).getTextContent()).items.map(s => s.str).join(' ') + "\n"; 
                            setDocPayload(f.name, t); 
                        } catch (err) { alert("PDF 解析失敗"); } finally { removeLoading(lid); } 
                    }; r.readAsArrayBuffer(f); 
                } 
                else if (ext === 'docx') { 
                    await loadMammoth(); 
                    r.onload = async (ev) => { 
                        try { setDocPayload(f.name, (await mammoth.extractRawText({ arrayBuffer: ev.target.result })).value); } catch(err) { alert("Word 解析失敗"); } finally { removeLoading(lid); } 
                    }; r.readAsArrayBuffer(f); 
                } 
                else if (ext === 'xlsx' || ext === 'csv') { 
                    await loadXlsx(); 
                    r.onload = (ev) => { 
                        try { 
                            const wb = XLSX.read(ev.target.result, { type: 'array' }); 
                            let t = ""; wb.SheetNames.forEach(n => { t += `\n--- 表單: ${n} ---\n`; let c = XLSX.utils.sheet_to_csv(wb.Sheets[n]); t += c; }); 
                            setDocPayload(f.name, t); 
                        } catch(err) { alert("Excel 解析失敗"); } finally { removeLoading(lid); } 
                    }; r.readAsArrayBuffer(f); 
                } 
                else if (ext === 'pptx') { 
                    r.onload = async (ev) => { 
                        try { await fallbackJSZipParse(f, ev.target.result, false, lid); } catch (err) { removeLoading(lid); } 
                    }; r.readAsArrayBuffer(f); 
                } 
                else { 
                    r.onload = (ev) => { setDocPayload(f.name, ev.target.result); removeLoading(lid); }; 
                    r.readAsText(f); 
                }
            } catch (err) { removeLoading(lid); alert("上傳過程發生錯誤"); }
        }

        async function fallbackJSZipParse(fileObj, fileData, isBase64, loaderId) {
            try { 
                await loadJszip(); const zip = await (new JSZip()).loadAsync(fileData, isBase64 ? { base64: true } : {}); 
                let t = `【系統解析：簡報檔名 ${fileObj.name}】\n\n`; 
                const sFiles = Object.keys(zip.files).filter(n => n.match(/^ppt\/slides\/slide\d+\.xml$/)).sort((a, b) => parseInt(a.match(/(\d+)\.xml$/)[1]) - parseInt(b.match(/(\d+)\.xml$/)[1]));
                const parser = new DOMParser(); 
                for (const p of sFiles) { 
                    const sn = p.match(/(\d+)\.xml$/)[1]; t += `--- 第 ${sn} 頁 ---\n`; 
                    const sx = await zip.file(p).async("string"); 
                    if (sx) { const xmlDoc = parser.parseFromString(sx, "text/xml"); t += Array.from(xmlDoc.getElementsByTagName("a:t")).map(n => n.textContent).join(" ") + "\n"; } 
                } setDocPayload(fileObj.name, t); 
            } catch (err) { alert("PPTX 解析失敗"); } finally { removeLoading(loaderId); }
        }

            // 刪除此訊息之後的所有訊息

            while (curr.nextElementSibling) {
                curr.nextElementSibling.remove();

            block.remove();

            await sendEditAndRegenerate(oldText, newText);

        async function sendEditAndRegenerate(oldText, newText) {
            appendMessage('user', newText);
            toggleSendButton(true);
            const lid = appendLoading("正在重新生成...");
            
            try {
                const modelSelector = document.getElementById('model-selector');
                const data = await fetchGAS('edit_and_regenerate', {
                    old_text: oldText,
                    message: newText,
                    session_id: currentSessionId,
                    workspace: currentWorkspace,
                    selected_model: modelSelector.value
                });

                removeLoading(lid);
                if (data.status === "error") throw new Error(data.error || "伺服器錯誤");
                if (data.reply) {
                    appendMessage('ai', data.reply, data.image ? `data:${data.mime};base64,${data.image}` : null, data.model);
                    speakText(data.reply, true);
                }
                loadSessions();
            } catch (err) {
                removeLoading(lid);
                appendMessage('ai', `❌ 重新生成失敗：\n${err.message}`);
            } finally {
                toggleSendButton(false);
            }
        }

        async function deleteSession(id) {
            if (confirm("確定要永久刪除這段對話嗎？")) {
                try {
                    await fetchGAS('delete_session', { mode: 'system', session_id: id, workspace: currentWorkspace });
                    if (id === currentSessionId) startNewSession();
                    loadSessions();
                } catch (e) { alert("刪除失敗"); }
            }
        }

        // 語音播放簡化
        function speakText(text, auto = false) {
            if (auto && !document.getElementById('voice-output-toggle')?.checked) return;
            const utterance = new SpeechSynthesisUtterance(text.replace(/[*#_]/g, ''));
            utterance.lang = 'zh-TW';
            window.speechSynthesis.speak(utterance);
        }

    </script>
</body>
</html>
