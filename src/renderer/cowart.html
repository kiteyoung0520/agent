<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cowart Canvas</title>
    <!-- Import Map 解決 React 依賴問題 -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18",
            "react/jsx-runtime": "https://esm.sh/react@18/jsx-runtime",
            "react-dom": "https://esm.sh/react-dom@18",
            "react-dom/client": "https://esm.sh/react-dom@18/client"
        }
    }
    </script>
    <link rel="stylesheet" href="https://unpkg.com/@tldraw/tldraw@3/tldraw.css" />
    <style> 
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #ffffff; } 
        #root { width: 100%; height: 100%; } 
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module">
        import React from 'react';
        import ReactDOM from 'react-dom/client';
        import { Tldraw, exportToBlob } from 'https://esm.sh/@tldraw/tldraw@3?bundle&external=react,react-dom';

        const root = ReactDOM.createRoot(document.getElementById('root'));
        let editorRef = null;

        root.render(React.createElement(Tldraw, {
            onMount: (editor) => {
                editorRef = editor;
                // 通知父視窗畫布已就緒
                window.parent.postMessage({ type: 'cowart_ready' }, '*');
            }
        }));

        // 監聽父視窗請求
        window.addEventListener('message', async (e) => {
            if (e.data.type === 'cowart_export') {
                if (!editorRef) return;
                const shapeIds = Array.from(editorRef.getCurrentPageShapeIds());
                if (shapeIds.length === 0) {
                    window.parent.postMessage({ type: 'cowart_export_empty' }, '*');
                    return;
                }
                try {
                    const blob = await exportToBlob({
                        editor: editorRef,
                        ids: shapeIds,
                        format: 'png',
                        opts: { background: true, padding: 32 }
                    });
                    
                    // 轉為 DataURL 回傳給父視窗
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onloadend = () => {
                        window.parent.postMessage({ 
                            type: 'cowart_export_result', 
                            dataUrl: reader.result 
                        }, '*');
                    };
                } catch (err) {
                    console.error(err);
                    window.parent.postMessage({ type: 'cowart_export_error', message: err.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
